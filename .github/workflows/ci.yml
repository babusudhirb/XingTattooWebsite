# Every push to main and every pull request: type-check, build the static site, then run the
# SEO, NAP and link checks against the built files. A failing step fails the run, so with
# branch protection on (Settings → Branches → require "build-and-check") it blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap <lastmod> comes from git history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Serve the build
        run: |
          node scripts/serve-static.mjs 4173 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4173/ && break; sleep 1; done

      - run: node scripts/qa/seo-audit.mjs http://localhost:4173
      - run: node scripts/qa/nap-check.mjs http://localhost:4173
      - run: node scripts/qa/link-check.mjs http://localhost:4173 --no-external
